services:
  api:
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      VIAL_HTTP_HOST: 0.0.0.0
      VIAL_HTTP_PORT: 8080
      VIAL_TRUSTED_PROXIES: ${VIAL_TRUSTED_PROXIES:-}
    ports:
      - "127.0.0.1:${VIALBOARD_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "vialboard", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
