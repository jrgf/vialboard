name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: vialboard
          POSTGRES_USER: vialboard
          POSTGRES_PASSWORD: vialboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vialboard -d vialboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vialboard:vialboard@localhost:5432/vialboard?sslmode=disable
      TEST_DATABASE_URL: postgres://vialboard:vialboard@localhost:5432/vialboard?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
      - run: go test -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...
      - run: docker build --tag vialboard:test .
      - run: docker run --rm --network host --env DATABASE_URL="$DATABASE_URL" vialboard:test migrate up
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vialboard:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
