name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: vialboard
          POSTGRES_USER: vialboard
          POSTGRES_PASSWORD: vialboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vialboard -d vialboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://vialboard:vialboard@localhost:5432/vialboard?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: docker build -t vialboard:test .
